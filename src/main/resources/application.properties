spring.application.name=stock-analysis
server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/stockdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Live Market Data (Alpha Vantage) Configuration
app.marketdata.enabled=${MARKET_DATA_ENABLED:false}
app.marketdata.api-key=${ALPHAVANTAGE_API_KEY:}
app.marketdata.symbol-suffix=${MARKET_DATA_SUFFIX:.BSE}
app.marketdata.cron=${MARKET_DATA_CRON:0 0 18 * * MON-FRI}
