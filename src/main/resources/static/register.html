<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - StockAnalysis</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js"></script>
  <script>
    if (isLoggedIn()) {
      window.location.replace('/dashboard.html');
    }
  </script>
</head>
<body>
  <nav class="navbar">
    <a href="/index.html" class="nav-brand">
      <div class="brand-icon">📈</div>
      <span>StockAnalysis</span>
    </a>
    <div class="nav-links">
      <a href="/login.html" class="btn btn-outline btn-sm">Sign In</a>
    </div>
  </nav>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="subtitle">Register to access 10 Indian equities and predictive forecasts</p>

      <div id="alertBox" class="alert alert-danger"></div>
      <div id="successBox" class="alert alert-success"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Choose a username (min. 3 chars)" required minlength="3" maxlength="50" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required minlength="6" maxlength="100" autocomplete="new-password">
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Sign Up</button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="/login.html">Sign in here</a>
      </div>
    </div>
  </div>

  <footer>
    <p>Educational purposes only, not financial advice</p>
  </footer>

  <script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      successBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (username.length < 3) {
        alertBox.textContent = 'Username must be at least 3 characters.';
        alertBox.style.display = 'block';
        return;
      }
      if (password.length < 6) {
        alertBox.textContent = 'Password must be at least 6 characters.';
        alertBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const data = await res.json();

        if (res.ok) {
          successBox.textContent = 'Account created successfully! Redirecting to login...';
          successBox.style.display = 'block';
          setTimeout(() => {
            window.location.replace('/login.html');
          }, 1200);
        } else {
          let msg = data.message || 'Registration failed.';
          if (data.fieldErrors && Object.keys(data.fieldErrors).length > 0) {
            msg = Object.entries(data.fieldErrors).map(([k, v]) => `${k}: ${v}`).join('; ');
          }
          alertBox.textContent = msg;
          alertBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign Up';
        }
      } catch (err) {
        alertBox.textContent = 'Failed to connect to server. Please try again.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign Up';
      }
    });
  </script>
</body>
</html>
