spring.application.name=stock-analysis
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.data-locations=classpath:data.sql,classpath:data-postgresql.sql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Live Market Data (Alpha Vantage) Configuration
app.marketdata.enabled=${MARKET_DATA_ENABLED:false}
app.marketdata.api-key=${ALPHAVANTAGE_API_KEY:}
app.marketdata.symbol-suffix=${MARKET_DATA_SUFFIX:.BSE}
app.marketdata.cron=${MARKET_DATA_CRON:0 0 18 * * MON-FRI}
